name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_META_PIXEL_ID: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Block malware npm script hooks
        run: |
          set -euo pipefail
          if grep -E '"[^"]+"\s*:\s*"node api\.js' package.json; then
            echo "::error file=package.json::Malware hook: npm scripts must not run api.js"
            exit 1
          fi
          if [ -f api.js ]; then
            echo "::error file=api.js::Unexpected root api.js — remove malware loader"
            exit 1
          fi
          echo "PASSED: no api.js script hooks"

  e2e:
    name: E2E (desktop + mobile, accessibility)
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXT_PUBLIC_BASE_URL: https://www.yuricart.com
      NEXT_PUBLIC_API_URL: http://localhost:8100
      NEXT_PUBLIC_META_PIXEL_ID: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build against the mock API
        run: npm run build

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
